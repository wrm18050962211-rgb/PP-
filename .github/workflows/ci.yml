name: Still CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  server-check:
    name: Server MVP Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pp_platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_platform_ci
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_platform_migration_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated migration database
        env:
          PGPASSWORD: postgres
        run: createdb --host=localhost --port=5432 --username=postgres pp_platform_migration_ci

      - name: Create isolated Store Lite booking database
        env:
          PGPASSWORD: postgres
        run: createdb --host=localhost --port=5432 --username=postgres pp_platform_store_lite_ci

      - name: Load database schema
        run: psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file database/schema.sql

      - name: Load Store Lite booking database schema
        run: psql "postgres://postgres:postgres@localhost:5432/pp_platform_store_lite_ci" --no-psqlrc --set ON_ERROR_STOP=1 --file database/schema.sql

      - name: Load pre-merchant migration baseline
        run: |
          set -o pipefail
          git show cac663d0fa9772b1d1420ac2c899f95c2a4d4ba6:database/schema.sql | psql "$MIGRATION_TEST_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1
          git show cac663d0fa9772b1d1420ac2c899f95c2a4d4ba6:database/seed_mvp.sql | psql "$MIGRATION_TEST_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1

      - name: Run server MVP checks
        working-directory: server
        run: npm run check:mvp

      - name: Run isolated order-read PostgreSQL audit
        working-directory: server
        env:
          ORDER_READ_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_platform_ci
          ALLOW_ORDER_READ_LIVE_TEST: "1"
        run: npm run check:postgres-order-read-live

      - name: Run isolated Store Lite booking PostgreSQL audit
        working-directory: server
        env:
          STORE_LITE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_platform_store_lite_ci
          ALLOW_STORE_LITE_LIVE_TEST: "1"
        run: npm run check:postgres-store-lite-booking-live

      - name: Run live PostgreSQL check
        working-directory: server
        run: npm run check:postgres-live

      - name: Run isolated composite-order migration audit
        working-directory: server
        env:
          ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: npm run check:composite-order-migration-live

  frontend-check:
    name: Frontend Production Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pp-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: pp-app
        run: npm ci

      - name: Run production guard checks
        working-directory: pp-app
        run: npm run check:production-guards

      - name: Build mobile app bundle
        working-directory: pp-app
        run: npm run build:mobile

      - name: Build admin web bundle
        working-directory: pp-app
        run: npm run build:admin
