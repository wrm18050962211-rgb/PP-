name: Still CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  server-check:
    name: Server MVP Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pp_platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pp_platform_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load database schema
        run: psql "$DATABASE_URL" -f database/schema.sql

      - name: Run server MVP checks
        working-directory: server
        run: npm run check:mvp

      - name: Run live PostgreSQL check
        working-directory: server
        run: npm run check:postgres-live

  frontend-check:
    name: Frontend Production Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pp-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: pp-app
        run: npm ci

      - name: Run production guard checks
        working-directory: pp-app
        run: npm run check:production-guards

      - name: Build mobile app bundle
        working-directory: pp-app
        run: npm run build:mobile

      - name: Build admin web bundle
        working-directory: pp-app
        run: npm run build:admin
