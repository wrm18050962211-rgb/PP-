<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Still 是 InFrame 推出的生活方式影像服务，留住城市、光线与此刻的样子。"
    />
    <meta name="theme-color" content="#101110" />
    <title>Still by InFrame</title>
    <style>
      :root {
        color: #f8f8f4;
        background: #101110;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #101110;
      }

      a {
        color: inherit;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 82svh;
        overflow: hidden;
        isolation: isolate;
      }

      .hero__image,
      .hero__shade {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero__image {
        z-index: -2;
        object-fit: cover;
        object-position: center 40%;
      }

      .hero__shade {
        z-index: -1;
        background: rgba(8, 10, 9, 0.56);
      }

      .nav {
        position: absolute;
        inset: 0 0 auto;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        padding: 0 5vw;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .nav__brand {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 760;
      }

      .nav__meta {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .hero__content {
        align-self: end;
        width: min(1180px, 90vw);
        margin: 0 auto;
        padding: 148px 0 9vh;
      }

      .hero__eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 18px;
        color: #9df0c9;
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .hero__eyebrow::before {
        width: 34px;
        height: 3px;
        background: #ff6a57;
        content: "";
      }

      h1 {
        max-width: 800px;
        margin: 0;
        font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif;
        font-size: 7.2rem;
        font-weight: 500;
        line-height: 0.9;
      }

      .hero__copy {
        max-width: 580px;
        margin: 28px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: 1.08rem;
        font-weight: 520;
        line-height: 1.8;
      }

      .hero__link {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        margin-top: 34px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.52);
        border-radius: 4px;
        background: rgba(10, 11, 10, 0.2);
        font-size: 0.9rem;
        font-weight: 760;
        text-decoration: none;
      }

      .hero__link:focus-visible,
      .hero__link:hover {
        border-color: #9df0c9;
        background: #9df0c9;
        color: #101110;
        outline: none;
      }

      .intro {
        display: grid;
        min-height: 36svh;
        place-items: center;
        padding: 72px 5vw;
        background: #f2f3ef;
        color: #171817;
        text-align: center;
      }

      .intro p {
        max-width: 850px;
        margin: 0;
        font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif;
        font-size: 2.2rem;
        line-height: 1.45;
      }

      .product {
        padding: 104px 5vw 112px;
        background: #171918;
        color: #f8f8f4;
      }

      .product__inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 390px);
        align-items: center;
        gap: 9vw;
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .product__eyebrow {
        margin: 0 0 16px;
        color: #ff7a67;
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .product h2 {
        max-width: 650px;
        margin: 0;
        font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif;
        font-size: 3.4rem;
        font-weight: 500;
        line-height: 1.16;
      }

      .product__lead {
        max-width: 620px;
        margin: 24px 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 1rem;
        line-height: 1.8;
      }

      .product__journey {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 44px 0 0;
        padding: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        list-style: none;
      }

      .product__journey li {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 12px;
        min-height: 76px;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.88);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .product__journey li:nth-child(odd) {
        padding-right: 22px;
      }

      .product__journey li:nth-child(even) {
        padding-left: 22px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
      }

      .product__number {
        color: #9df0c9;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .product__figure {
        width: min(100%, 360px);
        margin: 0;
        justify-self: end;
      }

      .product__screen-frame {
        position: relative;
        aspect-ratio: 448 / 720;
        overflow: hidden;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 7px;
        background: #050505;
        box-shadow: 0 28px 68px rgba(0, 0, 0, 0.42);
      }

      .product__screen {
        position: absolute;
        top: 0;
        left: 50%;
        display: block;
        width: auto;
        max-width: none;
        height: 100%;
        transform: translateX(-50%);
      }

      .product__caption {
        margin: 42px 0 0;
        color: rgba(255, 255, 255, 0.52);
        font-size: 0.76rem;
        line-height: 1.6;
      }

      @media (max-width: 720px) {
        .hero {
          min-height: 84svh;
        }

        .nav {
          min-height: 64px;
          padding: 0 20px;
        }

        .nav__meta {
          font-size: 0.7rem;
        }

        .hero__image {
          object-position: 58% center;
        }

        .hero__content {
          width: calc(100% - 40px);
          padding: 124px 0 54px;
        }

        h1 {
          font-size: 4.5rem;
        }

        .hero__copy {
          max-width: 34rem;
          margin-top: 22px;
          font-size: 1rem;
        }

        .intro {
          min-height: 34svh;
          padding: 56px 24px;
        }

        .intro p {
          font-size: 1.6rem;
        }

        .product {
          padding: 72px 24px 84px;
        }

        .product__inner {
          grid-template-columns: minmax(0, 1fr);
          gap: 58px;
        }

        .product h2 {
          font-size: 2.5rem;
        }

        .product__journey {
          grid-template-columns: minmax(0, 1fr);
        }

        .product__journey li,
        .product__journey li:nth-child(odd),
        .product__journey li:nth-child(even) {
          padding: 0;
          border-left: 0;
        }

        .product__figure {
          width: min(90%, 340px);
          justify-self: center;
        }

        .product__screen-frame {
          box-shadow: 0 22px 54px rgba(0, 0, 0, 0.38);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero__image"
          src="https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&amp;fit=crop&amp;w=2000&amp;q=88"
          alt="城市街道中的生活方式影像"
        />
        <div class="hero__shade" aria-hidden="true"></div>

        <header class="nav">
          <p class="nav__brand">InFrame</p>
          <p class="nav__meta">SHANGHAI · 2026</p>
        </header>

        <div class="hero__content">
          <p class="hero__eyebrow">InFrame presents</p>
          <h1 id="hero-title">Still</h1>
          <p class="hero__copy">
            留住此刻的样子。把城市、光线与真实状态，沉淀成值得回看的影像记忆。
          </p>
          <a class="hero__link" href="#still">认识 Still</a>
        </div>
      </section>

      <section class="intro" id="still" aria-label="Still 品牌介绍">
        <p>生活原本是流动的，Still 把值得记住的一刻安静地保存下来。</p>
      </section>

      <section class="product" aria-labelledby="product-title">
        <div class="product__inner">
          <div>
            <p class="product__eyebrow">Still / Product</p>
            <h2 id="product-title">从拍摄灵感，到一段被认真交付的影像记忆。</h2>
            <p class="product__lead">
              Still 面向真实生活场景，帮助用户发现合适的作品与摄影服务，完成预约、沟通和影像交付。
            </p>
            <ol class="product__journey" aria-label="Still 使用流程">
              <li><span class="product__number">01</span><span>发现作品</span></li>
              <li><span class="product__number">02</span><span>选择场景</span></li>
              <li><span class="product__number">03</span><span>预约拍摄</span></li>
              <li><span class="product__number">04</span><span>留住成片</span></li>
            </ol>
          </div>

          <figure class="product__figure">
            <div class="product__screen-frame">
              <img
                class="product__screen"
                src="assets/still-home.png"
                alt="Still 当前开发版本的发现页面"
              />
            </div>
            <figcaption class="product__caption">Still 当前开发版本 · 发现页</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
