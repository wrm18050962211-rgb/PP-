# Option B only: install this file after the apex A/AAAA record is intentionally
# pointed at this host. Keep www.weareinframe.com on its existing web host.
server {
    listen 80;
    listen [::]:80;
    server_name weareinframe.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.weareinframe.com$request_uri;
    }
}
